<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 150">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#9e9e9e"/>
    </marker>
  </defs>

  <!-- Step 1: Agent starts -->
  <rect x="10" y="42" width="120" height="52" rx="6" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="70" y="64" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="11" font-weight="600" fill="#2e7d32">Agent starts</text>
  <text x="70" y="80" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="10" fill="#81c784">long session</text>

  <line x1="135" y1="68" x2="165" y2="68" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 2: Context fills -->
  <rect x="170" y="42" width="120" height="52" rx="6" fill="#e3f2fd" stroke="#42a5f5" stroke-width="1.5"/>
  <text x="230" y="64" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="11" font-weight="600" fill="#1565c0">Context fills up</text>
  <text x="230" y="80" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="10" fill="#64b5f6">tokens accumulate</text>

  <line x1="295" y1="68" x2="325" y2="68" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 3: Agent calls compact — HIGHLIGHT -->
  <rect x="330" y="38" width="140" height="60" rx="6" fill="#fff8e1" stroke="#ff9800" stroke-width="2"/>
  <text x="400" y="60" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="12" font-weight="700" fill="#e65100">compact_context()</text>
  <text x="400" y="78" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="10" fill="#f57c00">agent-initiated</text>
  <text x="400" y="92" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="9" fill="#ffb74d">tool call</text>

  <line x1="475" y1="68" x2="505" y2="68" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 4: Compaction runs — dashed -->
  <rect x="510" y="42" width="120" height="52" rx="6" fill="#f3e5f5" stroke="#ab47bc" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="570" y="64" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="11" font-weight="600" fill="#6a1b9a">Compaction</text>
  <text x="570" y="80" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="10" fill="#ce93d8">non-blocking</text>

  <line x1="635" y1="68" x2="665" y2="68" stroke="#9e9e9e" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Step 5: Continues -->
  <rect x="670" y="42" width="130" height="52" rx="6" fill="#e8f5e9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="735" y="64" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="11" font-weight="600" fill="#2e7d32">Fresh context</text>
  <text x="735" y="80" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="10" fill="#81c784">agent continues</text>

  <!-- Annotation -->
  <text x="410" y="130" text-anchor="middle" font-family="-apple-system,system-ui,sans-serif" font-size="12" fill="#757575">Between steps — never blocks, context never overflows</text>
</svg>
